<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专业网站首页</title>
    <style>
        /* 全局样式 */
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            color: #333;
            background-color: #f4f4f4;
            line-height: 1.6;
        }

        /* 头部 */
        header {
            background-color: #fff;
            padding: 20px 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #007bff;
            text-decoration: none;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }

        nav ul li {
            margin-left: 20px;
        }

        nav ul li a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: #007bff;
        }

        /* 英雄部分 */
        .hero {
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('https://via.placeholder.com/1920x800?text=Hero+Image') no-repeat center center/cover;
            color: #fff;
            text-align: center;
            padding: 150px 0;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 24px;
            margin-bottom: 40px;
        }

        .btn {
            background-color: #007bff;
            color: #fff;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        /* 特性部分 */
        .features {
            padding: 80px 0;
            background-color: #fff;
        }

        .features h2 {
            text-align: center;
            font-size: 36px;
            margin-bottom: 40px;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .feature-item {
            background-color: #f9f9f9;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .feature-item h3 {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .feature-item p {
            font-size: 16px;
        }

        /* 关于部分 */
        .about {
            padding: 80px 0;
            background-color: #f4f4f4;
            text-align: center;
        }

        .about h2 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        .about p {
            max-width: 800px;
            margin: 0 auto 40px;
            font-size: 18px;
        }

        /* 页脚 */
        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 40px 0;
        }

        footer p {
            margin: 0;
        }

        footer a {
            color: #007bff;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .hero {
                padding: 100px 0;
            }

            .hero h1 {
                font-size: 36px;
            }

            .hero p {
                font-size: 18px;
            }

            nav ul {
                flex-direction: column;
            }

            nav ul li {
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="#" class="logo">我的专业网站</a>
                <ul>
                    <li><a href="#home">首页</a></li>
                    <li><a href="#features">特性</a></li>
                    <li><a href="#about">关于</a></li>
                    <li><a href="#contact">联系</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section id="home" class="hero">
        <div class="container">
            <h1>欢迎来到我的专业网站</h1>
            <p>我们提供高质量的服务，帮助您实现目标。</p>
            <a href="#features" class="btn">了解更多</a>
        </div>
    </section>

    <section id="features" class="features">
        <div class="container">
            <h2>我们的核心特性</h2>
            <div class="feature-grid">
                <div class="feature-item">
                    <h3>特性一</h3>
                    <p>专业设计，确保您的网站大方美观。</p>
                </div>
                <div class="feature-item">
                    <h3>特性二</h3>
                    <p>响应式布局，适配所有设备。</p>
                </div>
                <div class="feature-item">
                    <h3>特性三</h3>
                    <p>高效性能，快速加载体验。</p>
                </div>
            </div>
        </div>
    </section>

    <section id="about" class="about">
        <div class="container">
            <h2>关于我们</h2>
            <p>我们是一家致力于提供顶级网站解决方案的公司。凭借多年的经验，我们帮助无数客户打造了专业且吸引人的在线形象。</p>
            <a href="#contact" class="btn">联系我们</a>
        </div>
    </section>

    <footer id="contact">
        <div class="container">
            <p>&copy; 2025 我的专业网站。所有权利保留。 | <a href="mailto:info@example.com">联系我们</a></p>
        </div>
    </footer>
</body>
</html>
